server.port=8081
spring.application.name=patient-service

# Kết nối PostgreSQL (Cần tạo sẵn DB patient_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/patient_db
spring.datasource.username=postgres
# Luu y: Mat khau mac dinh trong de bai la 123456, nhung PostgreSQL tren may dang dung 04082001.
# De chay ngay tren may ta dung 04082001 (hoac tuy chinh qua bien moi truong DB_PASSWORD)
spring.datasource.password=${DB_PASSWORD:04082001}
spring.jpa.hibernate.ddl-auto=update

# Đăng ký vào Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
